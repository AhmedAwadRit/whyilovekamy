<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Things I never tell you</title>
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#05061a">
  <meta property="og:title" content="things i never tell you">
  <meta property="og:description" content="drafts, 2am thoughts, and messages i typed and never sent.">
  <meta property="og:image" content="https://whyilovekamy.com/assets/og-image.png">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/secrets.css">
</head>
<body>
  <canvas id="sky" aria-hidden="true"></canvas>
  <main>
    <header>
      <canvas id="moon" width="15" height="15" aria-hidden="true"></canvas>
      <h1>things i never tell you</h1>
      <p id="intro"></p>
    </header>
    <section id="thread" aria-live="polite"></section>
    <div id="actions">
      <button id="send" class="pixel-btn hidden"></button>
    </div>
    <p id="outro"></p>
    <div id="call-wrap" class="hidden"><button id="call-btn" class="pixel-btn ringing" type="button"></button></div>
    <p id="skip">tap to skip ahead</p>
  </main>

  <!-- A call from the moon -->
  <div id="call" hidden>
    <div class="phone">
      <canvas id="call-moon" width="15" height="15" aria-hidden="true"></canvas>
      <p id="call-name"></p>
      <p id="call-status"></p>
      <div id="call-wave" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
      <p id="call-sub" aria-live="polite"></p>
      <div id="call-choices"></div>
      <div id="call-actions">
        <button id="call-accept" class="round accept" type="button">accept</button>
        <button id="call-decline" class="round decline" type="button">decline</button>
      </div>
      <!-- secret: voicemail -->
      <button id="vm-btn" type="button" aria-label="voicemail" hidden><canvas width="9" height="5"></canvas></button>
      <div id="vm" hidden>
        <p id="vm-title"></p>
        <p id="vm-intro"></p>
        <div id="vm-list"></div>
        <p id="vm-sub" aria-live="polite"></p>
        <button id="vm-back" class="pixel-btn" type="button">back to the call</button>
      </div>
    </div>
  </div>
  <script src="js/content.js"></script>
  <script src="js/secrets.js"></script>
</body>
</html>
